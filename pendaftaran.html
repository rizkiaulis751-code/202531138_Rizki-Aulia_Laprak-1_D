  <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Praktikum - Pendaftaran</title>
</head>
<body>
  <nav>
    <a href="index.html">Beranda</a> |
    <a href="pendaftaran.html">Pendaftaran</a>
  </nav>
  <hr>

  <main>
    <h2>Form Pendaftaran Praktikan</h2>
    <form method="post" action="">
      <table>
        <tr>
          <td><label for="nama">Nama Lengkap</label></td>
          <td>: <input type="text" id="nama" name="nama"></td>
        </tr>
        <tr>
          <td><label for="pass">Password</label></td>
          <td>: <input type="password" id="pass" name="pass"></td>
        </tr>
        <tr>
          <td><label for="nim">NIM</label></td>
          <td>: <input type="number" id="nim" name="nim"></td>
        </tr>
        <tr>
          <td><label for="tgl">Tanggal Lahir</label></td>
          <td>: <input type="date" id="tgl" name="tgl"></td>
        </tr>
        <tr>
          <td>Jenis Kelamin</td>
          <td>:
            <label><input type="radio" name="jk" value="L"> Laki-Laki</label>
            <label><input type="radio" name="jk" value="P"> Perempuan</label>
          </td>
        </tr>
        <tr>
          <td>Minat bidang</td>
          <td>:
            <label><input type="checkbox" name="minat" value="web"> Web</label>
            <label><input type="checkbox" name="minat" value="network"> Jaringan</label>
            <label><input type="checkbox" name="minat" value="design"> Design/Modeling</label>
          </td>
        </tr>
        <tr>
          <td><label for="prodi">Program Studi</label></td>
          <td>:
            <select id="prodi" name="prodi">
              <option value="IF">S1 Teknik Informatika</option>
              <option value="SI">S1 Sistem Informasi</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="alasan">Alasan Mendaftar</label></td>
          <td>: <textarea id="alasan" name="alasan" rows="3" cols="20"></textarea></td>
        </tr>
        <tr>
          <td></td>
          <td>: <button type="submit">Kirim</button> <button type="reset">Reset</button></td>
        </tr>
      </table>
    </form>
  </main>
</body>
</html>
